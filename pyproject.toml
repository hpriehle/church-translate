[project]
name = "church-translate"
version = "0.1.0"
description = "Live English → French sermon translation (captions + audio) served to phones on the church LAN"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=1.26",
    "sounddevice>=0.5",
    "soxr>=0.5",
    "onnxruntime>=1.19",
    "httpx>=0.27",
    "segno>=1.6",
    "psutil>=6.0",
    "lameenc>=1.7",
    "pydantic>=2.8",
    "python-multipart>=0.0.12",
    "piper-tts>=1.3",
    # Speech-to-text on Apple Silicon
    "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Wolof voice (SpeechT5) on the Mac. On Linux: --extra wolof (CPU-only torch).
    "torch>=2.4; sys_platform == 'darwin'",
    "transformers>=4.45; sys_platform == 'darwin'",
    "sentencepiece>=0.2; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Only for developing/testing on a non-Mac machine (CPU Whisper).
dev-linux = ["faster-whisper>=1.0"]
wolof = ["torch>=2.4", "transformers>=4.45", "sentencepiece>=0.2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "websockets>=13"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
