<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Traduction en direct</title>
<link rel="stylesheet" href="/static/listener/listener.css">
</head>
<body>
<header>
  <span class="title">Traduction en direct</span>
  <span id="conn" class="pill wait">Connexion…</span>
</header>
<nav id="langs" class="langs" hidden aria-label="Langue"></nav>

<main id="captions" aria-live="polite" aria-label="Sous-titres en direct"></main>
<p id="waiting" class="waiting">La traduction commencera au début de la réunion.</p>

<footer>
  <button id="mute" class="mute" type="button" aria-pressed="false" aria-label="Activer le son">
    <svg class="ico ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h3l5-4v14l-5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    <svg class="ico ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h3l5-4v14l-5-4H4z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>
  </button>
  <div id="audioState" class="state">Touchez pour écouter · utilisez des écouteurs</div>
</footer>
<div id="startOverlay" class="start-overlay" hidden>
  <button id="startBtn" class="start-btn" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
    <span id="startLabel">Commencer</span>
  </button>
  <p id="startHint" class="start-hint">Touchez pour écouter la traduction en français. Utilisez des écouteurs.</p>
</div>
<script src="/static/listener/listener.js"></script>
</body>
</html>
