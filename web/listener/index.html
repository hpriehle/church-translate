<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Traduction en direct</title>
<link rel="stylesheet" href="/static/listener/listener.css">
</head>
<body>
<header>
  <span class="title">Traduction en direct · Français</span>
  <span id="conn" class="pill wait">Connexion…</span>
</header>

<main id="captions" aria-live="polite" aria-label="Sous-titres en direct"></main>
<p id="waiting" class="waiting">La traduction commencera au début de la réunion.</p>

<footer>
  <button id="mute" class="mute" type="button" aria-pressed="false">
    <span class="icon" aria-hidden="true">🔇</span>
    <span class="label"><b id="muteLabel">Son coupé</b><small id="muteHint">Touchez pour écouter</small></span>
  </button>
  <div id="audioState" class="state">🎧 Utilisez des écouteurs</div>
</footer>
<script src="/static/listener/listener.js"></script>
</body>
</html>
