<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0e1013">
<title>Speak · live translation</title>
<style>
  :root { --bg:#0e1013; --fg:#e4e6ea; --mute:#8b93a1; --bad:#e05252; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .wrap { max-width:520px; min-height:100%; margin:0 auto; padding:1.2rem 1.1rem; display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; align-items:center; gap:.6rem; }
  h1 { font-size:1.1rem; margin:0; font-weight:650; }
  .pill { font-size:.85rem; padding:.2rem .7rem; border-radius:999px; background:#1d2229; color:var(--mute); white-space:nowrap; }
  .pill.live { background:#5a1111; color:#ff9a9a; font-weight:700; }
  main { flex:1; display:flex; flex-direction:column; justify-content:center; padding:2rem 0; }
  button.big { width:100%; min-height:7rem; border:0; border-radius:1.4rem; font-size:1.7rem; font-weight:750; color:#fff; background:#1d5a33; }
  button.big.on { background:#5a1d1d; }
  button.big:disabled { opacity:.5; }
  .meter { height:14px; background:#222; border-radius:7px; overflow:hidden; margin:1.1rem 0 .4rem; }
  .meter div { height:100%; width:0; background:linear-gradient(90deg,#3c8,#3c8 70%,#ec3 85%,#e44); transition:width .08s; }
  .status { text-align:center; color:var(--mute); font-size:.95rem; min-height:1.4em; }
  .status b { color:var(--fg); font-weight:650; }
  .err { color:var(--bad); text-align:center; min-height:1.3em; margin:.6rem 0 0; }
  .tip { color:var(--mute); font-size:.9rem; text-align:center; }
  .tip a { color:#7fb2ff; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎙 Live translation</h1>
    <span id="pill" class="pill">ready</span>
  </header>

  <main>
    <button id="btn" class="big">🎙 Start speaking</button>
    <div class="meter"><div id="level"></div></div>
    <div id="status" class="status"></div>
    <div id="err" class="err"></div>
  </main>

  <p class="tip">Keep this page open with the screen on and the phone plugged in.<br>
    Listeners open <b id="listenUrl">the listening page</b> with headphones.<br>
    <a href="/guide" target="_blank">How to run a meeting from a phone</a></p>
</div>
<script src="/static/speak/speak.js"></script>
</body>
</html>
