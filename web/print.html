<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signs — listen to the translation</title>
<style>
  @page { size: letter portrait; margin: 12mm; }
  body { font-family: -apple-system, system-ui, "Segoe UI", sans-serif; color: #111; margin: 0; background: #eee; }
  .controls { background: #f6f6f6; padding: 10px 14px; border-bottom: 1px solid #ccc; font-size: 14px; line-height: 1.9; }
  .controls button { font: inherit; padding: 4px 12px; }
  .controls label { white-space: nowrap; margin-right: 10px; }
  .none { text-align: center; font-size: 16px; margin: 40px; }
  .sheet { background: #fff; width: 190mm; min-height: 250mm; margin: 8mm auto; box-sizing: border-box; padding: 16mm 14mm;
           text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;
           page-break-after: always; break-after: page; }
  .sheet.off { display: none; }
  .sheet.last { page-break-after: auto; break-after: auto; }
  h1 { font-size: 36pt; line-height: 1.12; margin: 0 0 8mm; }
  .scan { font-size: 24pt; font-weight: 700; margin: 0 0 6mm; }
  .qr { width: 112mm; height: 112mm; }
  .url { font-size: 17pt; font-weight: 700; margin: 4mm 0 10mm; word-break: break-all; }
  .phones { display: flex; align-items: center; gap: 6mm; font-size: 22pt; font-weight: 650; }
  .phones svg { width: 20mm; height: 20mm; flex: none; fill: none; stroke: #111; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .en { font-size: 12pt; color: #666; margin-top: 10mm; font-family: -apple-system, system-ui, "Segoe UI", sans-serif; }
  /* Scripts: a font that has them on a Mac first, then Windows and Linux. */
  .sheet:lang(zh) { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
  .sheet:lang(ne) { font-family: "Kohinoor Devanagari", "Devanagari Sangam MN", "Nirmala UI", "Noto Sans Devanagari", sans-serif; }
  .sheet:lang(ne) h1 { line-height: 1.35; }
  .sheet:lang(fa) { font-family: "Geeza Pro", "Noto Naskh Arabic", "Vazirmatn", "Segoe UI", "Tahoma", sans-serif; }
  .sheet:lang(fa) h1 { line-height: 1.4; }
  @media print { body { background: #fff; } .controls, .none { display: none; } .sheet { margin: 0 auto; } }
</style>
</head>
<body>
<div class="controls">
  <button id="print" onclick="window.print()">Print</button>
  · One sign per page. Each code opens the listening page in its language. Signs to print: <!--CHOICES-->
</div>

<!--SHEETS-->

<script>
  // The word after "#" in each language's link (/#french, /#wolof, …), which the listening page understands.
  const HASHES = /*HASHES*/{};
  const sheets = [...document.querySelectorAll(".sheet")];
  function update() {
    const on = new Set([...document.querySelectorAll(".controls input:checked")].map((i) => i.value));
    for (const s of sheets) { s.classList.toggle("off", !on.has(s.dataset.lang)); s.classList.remove("last"); }
    const shown = sheets.filter((s) => on.has(s.dataset.lang));
    if (shown.length) shown[shown.length - 1].classList.add("last");   // no blank page after the last sign
    const btn = document.getElementById("print");
    btn.textContent = shown.length === 1 ? "Print 1 sign" : `Print ${shown.length} signs`;
    btn.disabled = !shown.length;
  }
  document.querySelectorAll(".controls input").forEach((i) => i.addEventListener("change", update));
  update();
  // Codes point at the address this page was opened on when it's public (e.g. live.clntacq.com),
  // otherwise at the server's listener link; #french / #wolof … opens the page in that language.
  const VIA_PUBLIC = !/^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|100\.|\[|[\d.]+$)/.test(location.hostname);
  fetch("/api/state").then((r) => r.json()).then((s) => {
    const base = (VIA_PUBLIC ? location.origin + "/" : s.listener_url).replace(/\/?$/, "/");
    for (const sheet of sheets) {
      const url = base + "#" + HASHES[sheet.dataset.lang];
      sheet.querySelector(".qr").src = "/api/qr?text=" + encodeURIComponent(url);
      sheet.querySelector(".url").textContent = url.replace(/^https?:\/\//, "");
    }
  });
</script>
</body>
</html>
