name: HearLive
options:
  bundleIdPrefix: com.harrisonriehle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Opus:
    url: https://github.com/alta/swift-opus
    revision: 6f3cb6bd3ffed1fe5f06d00a962d5c191a50daf8

targets:
  HearLive:
    type: application
    platform: iOS
    sources:
      - path: HearLive
    settings:
      base:
        PRODUCT_NAME: HearLive
        PRODUCT_BUNDLE_IDENTIFIER: com.harrisonriehle.hearchurch.live
        INFOPLIST_FILE: HearLive/Info.plist
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5473W6M839
    dependencies:
      - package: Opus
        product: Copus

  # Pure logic only (protocol, jitter buffer): no host app needed.
  HearLiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HearLiveTests
      - path: HearLive/LiveProtocol.swift
      - path: HearLive/JitterBuffer.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.harrisonriehle.hearchurch.live.tests
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: 5473W6M839

schemes:
  HearLive:
    build:
      targets:
        HearLive: all
    test:
      targets:
        - HearLiveTests
