# hearchurch.com/download, /appcast.xml, /privacy and /terms: the Mac app's download page, Sparkle update feed and legal pages.
# The rest of hearchurch.com stays on the VPS. Files live in R2; mac/release.sh uploads them.
#   cd download && wrangler deploy
name = "hearchurch-download"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false
routes = [
  { pattern = "hearchurch.com/download*", zone_name = "hearchurch.com" },
  { pattern = "hearchurch.com/appcast.xml", zone_name = "hearchurch.com" },
  { pattern = "www.hearchurch.com/download*", zone_name = "hearchurch.com" },
  { pattern = "hearchurch.com/privacy", zone_name = "hearchurch.com" },
  { pattern = "hearchurch.com/terms", zone_name = "hearchurch.com" },
  { pattern = "www.hearchurch.com/privacy", zone_name = "hearchurch.com" },
  { pattern = "www.hearchurch.com/terms", zone_name = "hearchurch.com" },
  { pattern = "hearchurch.com/sitemap.xml", zone_name = "hearchurch.com" },
  # IndexNow's key file. The key is public by design: anyone can fetch it.
  { pattern = "hearchurch.com/b8a8b0718483acd04cef33be1f6d395c.txt", zone_name = "hearchurch.com" },
  # Siteboard analytics, loaded only by the /download page. Nothing on the listener pages uses these.
  { pattern = "hearchurch.com/api/collect", zone_name = "hearchurch.com" },
  { pattern = "hearchurch.com/rr.js", zone_name = "hearchurch.com" },
  { pattern = "hearchurch.com/rrweb.min.js", zone_name = "hearchurch.com" },
  # The marketing site (site/). The Worker hands anything that isn't one of its pages on to the VPS.
  { pattern = "hearchurch.com/", zone_name = "hearchurch.com" },
  { pattern = "www.hearchurch.com/", zone_name = "hearchurch.com" },
  { pattern = "hearchurch.com/how-it-works*", zone_name = "hearchurch.com" },
  { pattern = "hearchurch.com/lds*", zone_name = "hearchurch.com" },
  { pattern = "hearchurch.com/blog*", zone_name = "hearchurch.com" },
]

rules = [
  { type = "Text", globs = ["**/*.html", "**/*.txt"], fallthrough = false },
  { type = "Data", globs = ["**/*.png", "**/*.woff2"], fallthrough = false },
]

[[r2_buckets]]
binding = "FILES"
bucket_name = "hearchurch-downloads"

# Anonymous download totals (day, version, count). No IP addresses or anything else about who downloaded.
#   env -u CLOUDFLARE_API_TOKEN wrangler d1 execute hearchurch-stats --remote --command "SELECT version, SUM(count) FROM downloads GROUP BY version"
[[d1_databases]]
binding = "STATS"
database_name = "hearchurch-stats"
database_id = "7d370fdf-6d8b-47d3-90a7-3ebe2d0ac1c0"
migrations_dir = "migrations"

# Astro builds site/ into site/dist before every deploy; the Worker serves those pages (sitePage in src/index.js).
[build]
command = "npm --prefix ../site ci --silent && npm --prefix ../site run build"

[assets]
directory = "../site/dist"
binding = "SITE"
run_worker_first = true
